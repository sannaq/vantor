name: 종합 평점 백테스트 (매달)

# 매달 1일 아침, 지금 공식(score-core.js)이 최근 3년 동안 통했는지 다시 잰다 → feeds/backtest.json (미장은 feeds/backtest-us*.json)
# 사이트 '추천' 화면의 '검증 결과' 칸이 이 파일을 읽는다. 공식 자체를 자동으로 바꾸지는 않는다.
on:
  schedule:
    - cron: "0 0 1 * *"   # 매달 1일 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BT_CACHE: /tmp/vantor-bt3
      BT_DAYS: "1000"   # 약 4년치 일봉 → 3년 검증 (2026-10-08 사용자 결정)
      BT_WARM: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 백테스트
        run: node scripts/backtest.mjs --refresh && node scripts/backtest_levels.mjs && BT_H=60 node scripts/backtest.mjs && BT_H=60 node scripts/backtest_levels.mjs && node scripts/audit_backtest.mjs
      - name: 미장 백테스트 (미장 공식, 캐시 따로)
        env:
          MKT: US
          BT_CACHE: /tmp/vantor-bt3-us
        run: node scripts/backtest.mjs --refresh && node scripts/backtest_levels.mjs && BT_H=60 node scripts/backtest.mjs && BT_H=60 node scripts/backtest_levels.mjs
      - name: 결과 올리기
        run: |
          git add feeds/backtest.json feeds/backtest-levels.json feeds/backtest-60.json feeds/backtest-levels-60.json feeds/backtest-audit.json feeds/backtest-us.json feeds/backtest-levels-us.json feeds/backtest-us-60.json feeds/backtest-levels-us-60.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "auto $(TZ=Asia/Seoul date '+%F') 백테스트"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
