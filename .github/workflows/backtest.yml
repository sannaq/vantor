name: 종합 평점 백테스트 (매달)

# 매달 1일 아침, 지금 공식(score-core.js)이 최근 1년 동안 통했는지 다시 잰다 → feeds/backtest.json
# 사이트 '추천' 화면의 '검증 결과' 칸이 이 파일을 읽는다. 공식 자체를 자동으로 바꾸지는 않는다.
on:
  schedule:
    - cron: "0 0 1 * *"   # 매달 1일 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 백테스트
        run: node scripts/backtest.mjs --refresh && node scripts/backtest_levels.mjs
      - name: 결과 올리기
        run: |
          git add feeds/backtest.json feeds/backtest-levels.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "auto $(TZ=Asia/Seoul date '+%F') 백테스트"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
