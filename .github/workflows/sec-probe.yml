name: SEC 접속 진단 (임시)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - env: { SEC_CONTACT_EMAIL: '${{ secrets.SEC_CONTACT_EMAIL }}' }
        run: |
          node --input-type=module -e "
          import { createSecClient } from './scripts/paper-sec.mjs';
          import { plainText } from './scripts/paper-data.mjs';
          const sec = createSecClient();
          for (const c of ['WDC','AXTI','HPE']) { const r = await sec({c}, plainText); console.log('PROBE', c, r.reason, r.documents.length, r.documents[0]?.title||''); }"
