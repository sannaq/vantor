name: 수급 데이터 갱신

on:
  schedule:
    - cron: "*/30 0-6 * * 1-5"   # 평일 09:00~15:30 KST, 30분마다
    - cron: "0 7,10 * * 1-5"     # 16:00 장마감 확정 · 19:00 종목별 수급 확정
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flow-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수급 갱신
        run: python3 scripts/update_flow.py
      - name: 변경분 올리기
        run: |
          git add feeds/flow.json feeds/stock-list.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "auto $(TZ=Asia/Seoul date '+%F %H:%M') 수급 갱신"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
