name: 이번주 이벤트 자동 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (월요일 06:00 에 새 주로 교체)
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 보냈어도 디스코드로 다시 보내기 (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: events-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 이벤트 갱신
        run: python3 scripts/update_events.py
      - name: 변경분 올리기
        run: |
          git add events.json feeds/coin-events.json feeds/events-prev.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898099+github-actions[bot]@users.noreply.github.com"  # pull --rebase 도 커밋을 만든다
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "auto $(TZ=Asia/Seoul date +%F) 이번주 이벤트 갱신"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.12"
      - name: 디스코드 이벤트 요약판 (월=주간, 화~금=오늘·어제 결과)
        if: always()   # 일정 피드가 막혀 갱신을 못 해도 있는 일정으로 보낸다
        env:
          DISCORD_EVENT_WEBHOOK: ${{ secrets.DISCORD_EVENT_WEBHOOK }}
          FORCE: ${{ github.event.inputs.force == 'yes' && '1' || '' }}
        run: |
          dow=$(TZ=Asia/Seoul date +%u)
          if [ "$dow" -ge 6 ] && [ -z "$FORCE" ]; then echo "주말 → 건너뜀"; exit 0; fi
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-color-emoji
          pip install -q playwright && python -m playwright install --with-deps chromium
          git pull -q --rebase || true
          python3 scripts/events_image.py
          git add feeds/events-sent.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" commit -m "auto $(TZ=Asia/Seoul date +%F) 이벤트 디스코드 전송 기록"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
      - name: 만든 이미지 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-image
          path: /tmp/brief-img/*.png
          retention-days: 7
          if-no-files-found: ignore
