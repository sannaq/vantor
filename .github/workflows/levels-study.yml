name: 매수·손절·목표 규칙 스터디 (매주)

# 매주 토요일, 최근 3년 자료로 1차·2차·손절·목표가 규칙 후보를 다시 겨루고(scripts/levels_study.mjs),
# 앞 절반 1등이 뒤 절반에서도 지금 규칙보다 나으면 스스로 바꾼다 (2026-10-13 사용자 결정: 전부 자동).
# 종목별 예상 수익·예상 경로도 다시 만들고, 실제 추천 기록의 경로 적중으로 폭을 보정한다.
# → feeds/levels-model.json · feeds/levels-model-us.json (평일 채점 scripts/score_all.mjs 가 읽는다)
on:
  schedule:
    - cron: "0 0 * * 6"   # 토요일 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: levels-study
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 국장 스터디
        run: node scripts/levels_study.mjs
      - name: 미장 스터디
        env:
          MKT: US
        run: node scripts/levels_study.mjs
      - name: 결과 올리기
        run: |
          git add feeds/levels-model.json feeds/levels-model-us.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "auto $(TZ=Asia/Seoul date '+%F') 매수·손절·목표 규칙 스터디"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
