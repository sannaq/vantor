name: 브리핑 이미지 → 디스코드

# 워커가 briefs/<날짜>-<am|noon|pm>.json 을 올리면 수급·일정까지 담은 요약판으로 그려 디스코드에 보낸다.
# 웹후크 주소는 저장소 비밀값 DISCORD_BRIEF_WEBHOOK (없으면 이미지만 만들고 전송은 건너뜀).
on:
  push:
    branches: [main]
    paths: ["briefs/20*.json"]
  workflow_dispatch:
    inputs:
      files:
        description: "보낼 브리핑 파일 (공백 구분, 예: briefs/2026-10-08-am.json). 비우면 가장 최근 1건"
        required: false
        default: ""

permissions:
  contents: write   # 직전에 새로 받은 수급 자료를 저장소에도 올린다

concurrency:
  group: brief-image
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 보낼 브리핑 찾기
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="$INPUT_FILES"
            [ -z "$files" ] && files=$(ls briefs/20*.json | sort | tail -1)
          else
            base="$BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
            files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'briefs/20*.json' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "보낼 브리핑: ${files:-없음}"
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.files != ''
        with:
          python-version: "3.12"
      - name: 브라우저·한글 글꼴 준비
        if: steps.pick.outputs.files != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-color-emoji
          pip install -q playwright
          python -m playwright install --with-deps chromium
      # 깃허브 예약(flow.yml)은 몇 시간씩 늦거나 빠진다(10/12: 09:00~12:30 전부 누락 → 점심 이미지가 10/8 숫자).
      # 그래서 그리기 직전에 수급을 그 자리에서 다시 받는다. 실패하면 저장소에 있던 자료로 그린다.
      # 지난 브리핑을 손으로 다시 보낼 때(files 지정)는 그때 숫자와 안 맞으니 받지 않는다.
      - name: 수급 자료 새로 받기
        id: fresh
        if: steps.pick.outputs.files != '' && (github.event_name == 'push' || github.event.inputs.files == '')
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/update_flow.py
      - name: 이미지 만들어 보내기
        if: steps.pick.outputs.files != ''
        env:
          DISCORD_BRIEF_WEBHOOK: ${{ secrets.DISCORD_BRIEF_WEBHOOK }}
        run: python3 scripts/brief_image.py ${{ steps.pick.outputs.files }}
      - name: 만든 이미지 보관 (7일)
        if: always() && steps.pick.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: brief-images
          path: /tmp/brief-img/*.png
          retention-days: 7
      - name: 새로 받은 수급 자료 올리기
        if: steps.fresh.outcome == 'success'
        continue-on-error: true
        run: |
          git add feeds/flow.json feeds/industries.json feeds/news-main.json feeds/stock-list.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "auto $(TZ=Asia/Seoul date '+%F %H:%M') 수급 갱신 (브리핑 직전)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
