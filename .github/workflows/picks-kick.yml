name: 추천 정시 신호 (브리핑 도착 기준)

# 외부 워커 push와 Actions 브리핑 완료 모두 수신한다.
# GITHUB_TOKEN push는 다른 push 워크플로를 시작하지 않으므로 workflow_run도 필요하다.
# 오후 신호는 16:41까지 대기, 오전 신호는 직전 미국 거래일 추천을 확인한다.
# 예약은 브리핑 미도착 시 보조 경로이며 GitHub 예약 지연 자체를 보장하지는 않는다.
on:
  push:
    branches: [main]
    paths: ["briefs/20*.json"]
  workflow_run:
    workflows: ['국내 브리핑 누락 복구', '미장 브리핑 (장 전·장 중·장 마감)']
    branches: [main]
    types: [completed]
  schedule:
    - cron: '41 7 * * 1-5'
  workflow_dispatch:
    inputs:
      send:
        description: '디스코드 전송 (점검·복구 기본 no)'
        type: choice
        options: ['no', 'yes']
        default: 'no'
permissions:
  actions: write
  contents: read
concurrency:
  group: picks-kick
  cancel-in-progress: false
jobs:
  kick:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 15:00 신호도 16:41까지 101분을 기다릴 수 있어야 한다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 시각 보고 추천 실행
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
          SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.send || 'yes' }}
        run: python3 scripts/picks_kick.py
