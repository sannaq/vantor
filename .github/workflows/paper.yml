name: AI 퀀트 모의계좌
on:
  schedule:
    - cron: '11 8,10,23 * * *'
  workflow_run:
    workflows: ['종합 평점 → 사이트·디스코드', '미장 종합 평점 → 사이트·디스코드']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_check:
        type: boolean
        default: false
        description: '공시 공개 자료 연결 확인 (AI 호출 없음)'
permissions:
  contents: write
concurrency:
  group: paper-portfolios
  cancel-in-progress: false
jobs:
  paper:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 무료 AI 검토와 일봉 모의운용
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
        run: node scripts/paper-run.mjs
      - name: 공시 연결 확인
        if: github.event.inputs.source_check == 'true'
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          node --input-type=module - <<'JS'
          import { collectFilingResult } from './scripts/paper-data.mjs';
          for (const [market,c] of [['KR','005930'],['US','AAPL']]) {
            const d = await collectFilingResult(market,{c});
            console.log(market+' verified filings: '+d.documents.length+'; status='+d.reason);
          }
          JS
      - name: 모의계좌 상태 보존
        if: always()
        run: |
          git add feeds/paper-kr.json feeds/paper-us.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'auto: AI 퀀트 모의계좌 상태'
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
